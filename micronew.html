<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>33</title>
<style>
  :root{
    --bg: #0b0c0a;
    --bg-raised: #131510;
    --line: #2b2f26;
    --phosphor: #e8e8e4;
    --phosphor-dim: #3d8552;
    --amber: #ffffff;
    --red: #ff5c5c;
    --ink: #dfe6d9;
    --ink-dim: #7d867a;
    --mono: "JetBrains Mono","IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #131a12 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    min-height:100vh;
    padding:16px 20px 24px;
  }
  .wrap{max-width:1360px;margin:0 auto;}
  header{margin-bottom:14px;}
  .tag{font-size:11px;letter-spacing:.04em;color:var(--phosphor-dim);margin:0 0 4px;}
  h1{font-size:17px;margin:0 0 4px;font-weight:600;color:var(--ink);letter-spacing:.01em;}
  h1 span{color:var(--phosphor);}
  .desc{font-size:11.5px;line-height:1.4;color:var(--ink-dim);max-width:90ch;}

  .cols{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start;}
  @media (max-width:980px){ .cols{grid-template-columns:1fr;} }

  section{background:var(--bg-raised);border:1px solid var(--line);border-radius:3px;padding:12px 16px;margin-bottom:10px;}

  #drop{border:1px dashed var(--line);border-radius:3px;padding:14px 12px;text-align:center;cursor:pointer;transition:border-color .15s ease, background .15s ease;}
  #drop:hover, #drop.hover{border-color:var(--phosphor-dim);background:#0f130e;}
  #drop .big{font-size:12px;color:var(--ink);}
  #drop .small{font-size:10.5px;color:var(--ink-dim);margin-top:4px;}
  #fileInput{display:none;}
  #fileMeta{margin-top:8px;font-size:10.5px;color:var(--phosphor-dim);display:none;white-space:pre-wrap;}

  #waveWrap{margin-top:10px;display:none;}
  canvas#wave{width:100%;height:72px;display:block;background:#080906;border:1px solid var(--line);border-radius:2px;cursor:crosshair;}
  .wavehint{font-size:10px;color:var(--ink-dim);margin-top:6px;line-height:1.4;}
  .anchorbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap;gap:6px;}
  .anchorbar .n{font-size:10.5px;color:var(--amber);}
  .smallbtn{font-family:var(--mono);font-size:10.5px;padding:4px 8px;border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--ink-dim);cursor:pointer;}
  .smallbtn:hover{border-color:var(--red);color:var(--red);}

  .transport{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block;}
  .dot.live{background:var(--phosphor);box-shadow:0 0 8px rgba(232,232,228,.7);}
  .dot.rec{background:var(--red);box-shadow:0 0 8px rgba(255,92,92,.7);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .statusline{font-size:10.5px;color:var(--ink-dim);}

  #params{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 20px;max-height:calc(100vh - 90px);overflow-y:auto;padding-right:6px;}
  #params .row{grid-column:span 1;}
  #params .row.wide{grid-column:1/-1;}
  .row{margin-bottom:10px;}
  .row:last-child{margin-bottom:0;}
  .row-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .row-head label{font-size:11.5px;color:var(--ink);}
  .row-head .val{font-size:11px;color:var(--phosphor);}
  .row-note{font-size:9.5px;color:var(--ink-dim);margin-top:3px;line-height:1.35;}
  .minmax{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .minmax input{width:64px;min-width:0;flex:0 1 64px;}
  .minmax span{font-size:10px;color:var(--ink-dim);white-space:nowrap;}

  input[type=range]{-webkit-appearance:none;width:100%;height:2px;background:var(--line);outline:none;margin:0;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--phosphor);cursor:pointer;box-shadow:0 0 8px rgba(232,232,228,.5);}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--phosphor);cursor:pointer;}

  input[type=number], input[type=text]{
    width:100%;background:transparent;border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:12.5px;padding:8px 10px;border-radius:2px;
  }

  .btnrow{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap;grid-column:1/-1;}
  button{font-family:var(--mono);font-size:11.5px;padding:8px 14px;border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:border-color .15s ease, color .15s ease;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;}
  button.primary{background:var(--phosphor);color:#0b0c0a;border-color:var(--phosphor);font-weight:600;}
  button.primary:hover{background:#93ffb2;}
  button.danger{border-color:var(--red);color:var(--red);}
  button.danger:hover{background:var(--red);color:#0b0c0a;}
  button:not(.primary):not(.danger):hover{border-color:var(--phosphor-dim);color:var(--phosphor);}
  button:disabled{opacity:.35;cursor:not-allowed;}
  .noteAlt{padding:5px 10px;font-size:10.5px;}
  .modeBtn{padding:6px 12px;font-size:11px;margin-right:6px;}

  #status{font-size:10.5px;color:var(--amber);margin-top:6px;min-height:14px;}

  #recOutput{display:none;margin-top:8px;}
  audio{width:100%;margin-top:4px;}
  a.dl{display:inline-block;margin-top:8px;font-size:11.5px;color:var(--phosphor);text-decoration:none;border-bottom:1px solid var(--phosphor-dim);padding-bottom:1px;}
  a.dl:hover{color:#93ffb2;}

  footer{margin-top:10px;font-size:9.5px;color:var(--ink-dim);line-height:1.4;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}

  /* ---- spacing & type ---- */
  :root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;}
  body{font-size:12px;line-height:1.6;padding:var(--s4) var(--s5) var(--s5);}
  header{margin-bottom:var(--s4);}
  section{padding:var(--s4);margin-bottom:var(--s3);}
  .cols{gap:var(--s4);}
  #drop .small{margin-top:var(--s1);}
  #fileMeta,#status,.anchorbar,.wavehint{margin-top:var(--s2);}
  #waveWrap{margin-top:var(--s3);}
  .transport{gap:var(--s2);margin-bottom:var(--s2);}
  #params{grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--s5);max-height:none;overflow:visible;padding-right:var(--s4);}
  .row{grid-column:span 2;margin:0;}
  .row.half{grid-column:span 3;}
  .row.wide{grid-column:1/-1;}
  .btnrow{margin:0;gap:var(--s2);}
  .row-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);margin-bottom:var(--s2);}
  .row-head.sub{margin-top:var(--s4);}
  .row-head label{font-size:12px;color:var(--ink);}
  .row-head .val{font-size:12px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .row-note{font-size:10.5px;line-height:1.5;color:var(--ink-dim);margin:var(--s2) 0 0;}
  button{font-size:11.5px;line-height:1.2;padding:8px 14px;}
  #btnFilter{width:100%;}
  .modes{display:flex;gap:var(--s2);margin-bottom:var(--s3);}
  .modeBtn{margin:0;padding:6px 12px;font-size:11.5px;}
  .fieldline{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3);}
  .fieldline input{width:88px;flex:none;}
  .chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2);}
  .noteAlt{min-width:52px;padding:6px 10px;font-size:11.5px;text-align:center;}
  .minmax{gap:var(--s2);}
  @media (max-width:640px){ .row,.row.half{grid-column:1/-1;} }

  /* ---- type & tone ---- */
  html{-webkit-font-smoothing:antialiased;}
  .tag{font-size:13px;letter-spacing:.34em;color:var(--phosphor);margin:0;text-shadow:0 0 12px rgba(232,232,228,.35);}
  header{padding-bottom:var(--s3);border-bottom:1px solid var(--line);}
  section{border-radius:0;}
  .row-head label,.cap{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);}
  .row-head .val{font-size:12px;color:var(--phosphor);letter-spacing:.04em;}
  button,.smallbtn{text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;}
  .noteAlt{letter-spacing:.06em;text-transform:none;font-size:11.5px;}
  #drop{padding:var(--s4) var(--s3);}
  #drop .big{font-size:11px;letter-spacing:.2em;color:var(--ink-dim);}
  #fileMeta,#status{letter-spacing:.08em;}
  #status{color:var(--phosphor-dim);}
  .anchorbar .n{letter-spacing:.14em;font-size:10.5px;}
  .chips{margin-top:0;}
  .row-head.sub{margin-top:var(--s4);}
  input[type=range]::-webkit-slider-thumb{border-radius:0;width:9px;height:15px;}
  input[type=range]::-moz-range-thumb{border-radius:0;width:9px;height:15px;}

  /* ---- panel UI ---- */
  :root{--mono:"Jost","Futura","Avenir Next","Hiragino Sans",system-ui,sans-serif;--cap:#e8e8e4;--capdim:#8a8a87;--panel:#2a2a2a;--ink:#e8e8e4;--ink-dim:#9a9a96;--phosphor:#e8e8e4;--phosphor-dim:#9a9a96;--amber:#ffffff;--red:#e07a7a;--line:#444442;}
  [hidden]{display:none!important;}
  body{background:#f2f3f5;color:var(--ink);padding:24px;font-size:14px;}
  .wrap{position:relative;max-width:900px;margin:0 auto;background:var(--panel);padding:48px 64px 64px;}
  .wrap::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.28;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
  .wrap>*{position:relative;}
  header{display:flex;justify-content:space-between;align-items:baseline;border:none;padding:0;margin:0;font-size:20px;font-weight:500;}
  .logo{letter-spacing:.02em;}
  #star{display:flex;flex-direction:column;align-items:center;gap:16px;margin:32px 0 48px;}
  #starCv{width:280px;height:280px;}
  #starLabel{font-size:20px;font-weight:500;min-height:28px;}
  .cols{display:flex;flex-direction:column;gap:48px;align-items:stretch;}
  .cols>div{display:contents;}
  section{background:transparent;border:none;padding:0;margin:0;}
  .cols>div>section:first-child{order:1;} #controls{order:2;} #params{order:3;} #recOutput{order:4;}
  #drop{border:1px solid var(--line);border-radius:6px;}
  #drop .big{font-size:14px;letter-spacing:.02em;text-transform:lowercase;}
  canvas#wave{background:transparent;border:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;}
  .transport{justify-content:center;gap:16px;margin:0;}
  .transport>span[style]{flex:0 0 24px!important;}
  .statusline,#status{text-align:center;margin-top:20px;font-size:13px;color:var(--ink-dim);letter-spacing:.02em;}
  button,.smallbtn{font-family:var(--mono);position:relative;margin-bottom:8px;background:var(--cap);color:var(--panel);border:none;border-radius:3px;padding:6px 18px;font-size:15px;font-weight:500;letter-spacing:.02em;text-transform:lowercase;touch-action:manipulation;}
  button::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:4px;border-radius:2px;background:inherit;}
  button.primary,button:not(.primary):not(.danger):hover,button.primary:hover{background:var(--cap);color:var(--panel);border:none;}
  button:disabled{background:var(--capdim);color:#4d4d4b;opacity:1;}
  .modeBtn:not(.primary),.noteAlt:not(.primary),#btnFilter:not(.primary){background:var(--capdim);color:#4d4d4b;}
  .smallbtn{font-size:12px;padding:4px 12px;margin-bottom:6px;} .smallbtn::after{bottom:-6px;height:3px;}
  .noteAlt{padding:4px 12px;font-size:13px;min-width:0;} .noteAlt::after{display:none;} .noteAlt{margin-bottom:0;}
  #params{grid-template-columns:repeat(4,minmax(0,1fr));gap:44px 28px;max-height:none;overflow:visible;padding:0;}
  #params>.row{grid-column:span 1;display:flex;flex-direction:column;align-items:center;gap:10px;margin:0;}
  #params>.row:nth-child(5){grid-column:span 3;}
  #params>.btnrow{order:9;grid-column:1/-1;justify-content:center;gap:24px;}
  #params>.row:nth-child(2){order:1;} #params>.row:nth-child(3){order:2;} #params>.row:nth-child(6){order:3;} #params>.row:nth-child(7){order:4;} #params>.row:nth-child(4){order:5;} #params>.row:nth-child(5){order:6;}
  #params>.row:nth-child(4) .row-head{display:none;}
  #params>.row:nth-child(5) .row-head:first-child{display:none;}
  .row-head{display:contents;}
  #params>.row:not(.wide) .row-head label{order:1;background:var(--cap);color:var(--panel);border-radius:3px;padding:6px 18px;font-size:15px;font-weight:500;letter-spacing:.02em;text-transform:lowercase;}
  .row-head .val{order:3;font-size:12px;color:var(--ink-dim);letter-spacing:.02em;font-variant-numeric:tabular-nums;}
  input[type=range]{order:2;-webkit-appearance:none;appearance:none;width:100%;max-width:150px;height:22px;background:transparent;cursor:pointer;}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--cap) var(--p,50%),#4a4a48 var(--p,50%));}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--cap) var(--p,50%),#4a4a48 var(--p,50%));}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0;border:0;box-shadow:none;background:transparent;}
  input[type=range]::-moz-range-thumb{width:0;height:0;border:0;background:transparent;}
  #params>.row.wide{align-items:center;text-align:center;}
  #params .row.wide .row-head{display:flex;justify-content:center;gap:12px;}
  #params .row.wide .row-head label{background:none;padding:0;font-size:13px;color:var(--ink-dim);font-weight:400;}
  .modes,.fieldline{justify-content:center;} .chips{justify-content:center;}
  #zoneBpmControls{width:100%;} #zoneBpmControls input[type=range]{margin:0 auto;display:block;}
  input[type=number],input[type=text]{background:transparent;border:none;border-bottom:1px solid var(--line);border-radius:0;color:var(--ink);text-align:center;font-size:15px;}
  .row-head.sub{margin-top:24px;}
  audio{color-scheme:dark;}
  #protocolWarning p{color:var(--red)!important;}
  @media (max-width:760px){ .wrap{padding:32px 24px 48px;} #params{grid-template-columns:repeat(2,minmax(0,1fr));} #params>.row:nth-child(5){grid-column:1/-1;} }

  /* ---- one-screen layout ---- */
  body{padding:12px;}
  .wrap{display:flex;flex-direction:column;height:calc(100vh - 24px);min-height:0;overflow:auto;padding:28px 40px;}
  header{flex:none;font-size:18px;}
  .cols{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:28px 56px;flex:1;min-height:0;align-items:start;}
  .cols>div{display:block;grid-column:1;grid-row:1/span 2;}
  .cols>div>section{order:0;margin-bottom:20px;}
  #recOutput{margin-bottom:0;}
  #star{grid-column:2;grid-row:1;margin:0;flex-direction:row;justify-content:center;align-items:center;gap:28px;}
  #starCv{width:130px;height:130px;}
  #starLabel{font-size:18px;min-width:120px;}
  #params{grid-column:2;grid-row:2;order:0;gap:28px 24px;align-content:start;}
  #status{margin-top:12px;}
  @media (max-height:760px){ .wrap{padding:20px 32px;} #starCv{width:100px;height:100px;} #params{gap:20px 24px;} .cols>div>section{margin-bottom:14px;} }
  @media (max-width:900px){ .wrap{height:auto;overflow:visible;} .cols{grid-template-columns:1fr;} .cols>div,#star,#params{grid-column:1;grid-row:auto;} }

  /* ---- design grid: 8px unit, caps 36px / 28px ---- */
  :root{--u:8px;--cap-h:36px;--cap-s:28px;}
  button,.smallbtn{height:var(--cap-h);padding:0 16px;margin:0;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;font-size:14px;line-height:1;}
  button::after,.smallbtn::after{display:none!important;}
  .smallbtn{height:var(--cap-s);min-width:80px;padding:0 12px;font-size:12px;}
  .modeBtn{width:88px;height:var(--cap-s);padding:0;font-size:13px;}
  .noteAlt{width:52px;height:var(--cap-s);padding:0;font-size:13px;}
  .transport button{width:96px;}
  #params>.btnrow button{width:128px;}
  #btnFilter{width:100%;}
  #params>.row{align-items:stretch;gap:var(--u);}
  #params>.row.wide{align-items:center;}
  #params>.row:not(.wide) .row-head label{width:100%;height:var(--cap-h);display:flex;align-items:center;justify-content:center;padding:0;font-size:14px;white-space:nowrap;}
  .row-head .val{text-align:center;}
  input[type=range]{max-width:none;width:100%;}
  #params{gap:32px 24px;}
  @media (max-height:760px){ #params{gap:24px 24px;} }
  #xyCv{width:160px;height:160px;touch-action:none;cursor:crosshair;}
  #starLabel{min-width:96px;}
  @media (max-height:760px){ #xyCv{width:120px;height:120px;} }
  #xyCv{width:min(240px,27vh);height:min(240px,27vh);}
  @media (max-height:760px){ #xyCv{width:min(180px,24vh);height:min(180px,24vh);} }
  .cols>div{display:flex;flex-direction:column;align-self:stretch;min-height:0;}
  #xySec{flex:1 1 0;min-height:120px;overflow:hidden;display:flex;justify-content:center;align-items:center;margin-bottom:20px;}
  #xySec #xyCv{flex:none;}
  @media (max-width:900px){ .cols>div{display:block;} #xySec{height:320px;flex:none;} }

  /* ---- corners + center, 4-column grid ---- */
  .wrap{max-width:1600px;}
  .cols{grid-template-columns:minmax(260px,1fr) minmax(240px,.9fr) minmax(380px,1.4fr);grid-template-rows:minmax(0,1fr);gap:40px;align-items:stretch;}
  #left{grid-column:1;grid-row:1;justify-content:space-between;}
  #mid{grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:center;align-self:stretch;min-height:0;}
  #star{margin:0 0 16px;flex:none;}
  #starCv{width:96px;height:96px;}
  #xySec{align-self:stretch;margin-bottom:0;}
  #params{grid-column:3;grid-row:1;display:grid;grid-template-rows:auto 1fr auto;align-content:stretch;gap:0;}
  .p-top{grid-row:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;align-items:start;}
  .p-bot{grid-row:3;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 24px;align-items:center;}
  .p-bot>button,.p-bot .modeBtn{width:100%;height:var(--cap-h);font-size:14px;}
  .modes{display:contents;}
  .zoneval{display:flex;align-items:center;justify-content:center;height:var(--cap-h);min-width:0;}
  .zoneval .minmax{display:flex;align-items:center;gap:6px;}
  .zoneval input{width:56px;font-size:14px;}
  #zoneBpmControls{align-items:center;gap:8px;}
  #bpmVal{width:64px;}
  #notesBlock{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 24px;}
  #notesBlock .noteAlt{width:100%;}
  #params #jumpCell{grid-column:1/3;}
  #btnRandom{grid-column:3;} #btnResetParams{grid-column:4;}
  .p-top .row,#jumpCell{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin:0;}
  .p-top .row-head label,#jumpCell .row-head label{order:1;background:none;color:var(--ink);padding:0;height:auto;width:auto;display:block;text-align:center;font-size:14px;font-weight:500;letter-spacing:.02em;text-transform:lowercase;}
  .p-top .row-head .val,#jumpCell .row-head .val{order:3;text-align:center;}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;}
  input[type=range]::-moz-range-track{height:6px;border-radius:3px;}
  .transport{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .transport button{width:100%;}
  .transport>span{display:none;}
  #liveDot.live+#btnPlay{background:#fff;box-shadow:0 0 14px rgba(255,255,255,.5);}
  #recDot.rec+#btnRecord{background:#e07a7a;animation:pulse 1s infinite;}
  #params{grid-template-columns:minmax(0,1fr);padding:0;max-height:none;overflow:visible;}
  #mid{position:relative;justify-content:center;}
  #star{position:absolute;top:0;left:50%;transform:translateX(-50%);margin:0;}
  #xySec{flex:0 1 auto;height:100%;margin:112px 0;max-height:calc(100% - 224px);align-self:stretch;}
  .zoneval input{width:48px;} #bpmVal{width:52px;} .zoneval{gap:6px;} #zoneBpmControls{gap:6px;}
  @media (max-width:900px){ .cols{grid-template-columns:1fr;grid-template-rows:none;} #left,#mid,#params{grid-column:1;grid-row:auto;} #mid{min-height:380px;} }

  /* ---- star + pad share the exact centre ---- */
  #star{position:absolute;left:0;right:0;top:0;bottom:0;transform:none;margin:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;}
  #xySec{position:relative;z-index:1;margin:0;height:100%;max-height:100%;}
  #btnTheme{height:24px;min-width:72px;font-size:11px;padding:0 12px;}
  :root{--rgb:232,232,228;--hex:#e8e8e4;--rainbow:0;}
  /* ---- theme: psy ---- */
  html[data-theme=psy]{--rgb:255,120,255;--hex:#ff7bff;--rainbow:1;--cap:#fff0ff;--capdim:#4a1d78;--panel:#12041f;--ink:#ffe9ff;--ink-dim:#d29bff;--line:#7a2fbf;}
  html[data-theme=psy] body{background:#0b0214;}
  html[data-theme=psy] .wrap{background:radial-gradient(circle at 50% 50%,#6a12b8 0,#2a0a52 40%,#12041f 78%);}
  html[data-theme=psy] .wrap::before{opacity:.45;mix-blend-mode:overlay;}
  html[data-theme=psy] .wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,0,200,.09) 0 5deg,rgba(0,255,230,.07) 5deg 10deg);mix-blend-mode:screen;}
  html[data-theme=psy] button{background:linear-gradient(135deg,#ff6bd6,#7b6bff 55%,#4be3ff);color:#16042a;box-shadow:0 0 14px rgba(255,107,214,.45);}
  html[data-theme=psy] .modeBtn:not(.primary),html[data-theme=psy] .noteAlt:not(.primary),html[data-theme=psy] #btnFilter:not(.primary),html[data-theme=psy] button:disabled{background:#4a1d78;color:#b98cff;box-shadow:none;}
  html[data-theme=psy] input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(to right,#ff6bd6 0,#4be3ff var(--p),#3a1566 var(--p));}
  html[data-theme=psy] input[type=range]::-moz-range-track{background:linear-gradient(to right,#ff6bd6 0,#4be3ff var(--p),#3a1566 var(--p));}
  html[data-theme=psy] .row-head label,html[data-theme=psy] .logo,html[data-theme=psy] .live{text-shadow:0 0 10px rgba(255,107,214,.9);}
  /* ---- theme: web (webcore) ---- */
  html[data-theme=web]{--rgb:57,255,20;--hex:#39ff14;--cap:#c0c0c0;--capdim:#808080;--panel:#000;--ink:#ffff66;--ink-dim:#00ffff;--line:#ff00ff;--mono:"MS Gothic","Osaka-Mono","Courier New",monospace;}
  html[data-theme=web] body{background:#008080;}
  html[data-theme=web] .wrap{background:#000 radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 80px 120px,#ff0,transparent),radial-gradient(2px 2px at 140px 60px,#0ff,transparent);background-size:180px 160px;border:4px ridge #c0c0c0;}
  html[data-theme=web] .wrap::before{display:none;}
  html[data-theme=web] .wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);}
  html[data-theme=web] button{border:2px outset #fff;border-radius:0;background:#c0c0c0;color:#000;font-weight:400;letter-spacing:0;text-transform:none;}
  html[data-theme=web] button:active{border-style:inset;}
  html[data-theme=web] .modeBtn:not(.primary),html[data-theme=web] .noteAlt:not(.primary),html[data-theme=web] #btnFilter:not(.primary),html[data-theme=web] button:disabled{background:#808080;color:#404040;border-style:inset;}
  html[data-theme=web] input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:0;border:1px solid #39ff14;background:linear-gradient(to right,#39ff14 var(--p),#003300 var(--p));}
  html[data-theme=web] input[type=range]::-moz-range-track{height:8px;border-radius:0;border:1px solid #39ff14;background:linear-gradient(to right,#39ff14 var(--p),#003300 var(--p));}
  html[data-theme=web] .logo{background:linear-gradient(90deg,#f0f,#0ff,#ff0);-webkit-background-clip:text;background-clip:text;color:transparent;}
  html[data-theme=web] .logo::after{content:" \2605 \2606 \2605";}
  html[data-theme=web] .live{animation:blinkw 1s steps(2) infinite;color:#f00;}
  @keyframes blinkw{50%{opacity:0}}
  html[data-theme=web] #drop,html[data-theme=web] canvas#wave{border-color:#ff00ff;}
  /* ---- theme: acid ---- */
  html[data-theme=acid]{--rgb:215,255,0;--hex:#d7ff00;--cap:#d7ff00;--capdim:#2b2b2b;--panel:#000;--ink:#fff;--ink-dim:#8a8a8a;--line:#3a3a3a;--mono:"Arial Narrow","Helvetica Neue",Arial,sans-serif;}
  html[data-theme=acid] body{background:#d7ff00;}
  html[data-theme=acid] .wrap::before{display:none;}
  html[data-theme=acid] button{border-radius:0;text-transform:uppercase;font-weight:700;letter-spacing:.08em;}
  html[data-theme=acid] .modeBtn:not(.primary),html[data-theme=acid] .noteAlt:not(.primary),html[data-theme=acid] #btnFilter:not(.primary),html[data-theme=acid] button:disabled{background:transparent;color:#d7ff00;border:1px solid #d7ff00;}
  html[data-theme=acid] .row-head label,html[data-theme=acid] .logo,html[data-theme=acid] .live{text-transform:uppercase;font-weight:700;letter-spacing:.1em;}
  html[data-theme=acid] input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:0;background:linear-gradient(to right,#d7ff00 var(--p),#2b2b2b var(--p));}
  html[data-theme=acid] input[type=range]::-moz-range-track{height:8px;border-radius:0;background:linear-gradient(to right,#d7ff00 var(--p),#2b2b2b var(--p));}
  html[data-theme=acid] #drop{border-radius:0;border:2px solid #d7ff00;}
  .p-top .row-head label,#jumpCell .row-head label{white-space:nowrap;}
  html[data-theme=web] .wrap{background-color:#000;background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 80px 120px,#ff0,transparent),radial-gradient(2px 2px at 140px 60px,#0ff,transparent);background-size:180px 160px;}
  html[data-theme=web] .row-head label{font-size:12px;}
  html[data-theme=acid] .row-head label{font-size:12.5px;letter-spacing:.04em;}
  html[data-theme=acid] button{font-size:12.5px;letter-spacing:.03em;}

  /* ---- final: flat, three colours (--bg / --fg / --ac) ---- */
  :root{--bg:#15112e;--fg:#f1e9d2;--ac:#ff6b4a;--cap:var(--fg);--capdim:transparent;--panel:var(--bg);--ink:var(--fg);--ink-dim:var(--fg);--line:var(--fg);--phosphor:var(--fg);--red:var(--ac);}
  body{background:var(--bg);color:var(--fg);padding:0;}
  .wrap{background:var(--bg);margin:12px;max-width:none;height:calc(100vh - 24px);border:2px solid var(--fg);}
  .wrap::before,.wrap::after{display:none!important;}
  #btnTheme{display:none;}
  .logo,.live{color:var(--fg);font-size:18px;font-weight:500;}
  button,.smallbtn{background:transparent!important;color:var(--fg)!important;border:2px solid var(--fg)!important;border-radius:0!important;box-shadow:none!important;font-weight:500;}
  button:hover{background:var(--fg)!important;color:var(--bg)!important;}
  button.primary,.modeBtn.primary,.noteAlt.primary,#btnFilter.primary{background:var(--fg)!important;color:var(--bg)!important;}
  button:disabled{opacity:.35;}
  #liveDot.live+#btnPlay,#recDot.rec+#btnRecord{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--bg)!important;animation:none;}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:0;border:1px solid var(--fg);box-sizing:border-box;background:linear-gradient(to right,var(--fg) var(--p,50%),transparent var(--p,50%));}
  input[type=range]::-moz-range-track{height:6px;border-radius:0;border:1px solid var(--fg);box-sizing:border-box;background:linear-gradient(to right,var(--fg) var(--p,50%),transparent var(--p,50%));}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:20px;margin-top:-8px;background:var(--ac);border:none;border-radius:0;}
  input[type=range]::-moz-range-thumb{width:6px;height:20px;background:var(--ac);border:none;border-radius:0;}
  .row-head label,.p-top .row-head label,#jumpCell .row-head label{color:var(--fg);font-size:14px;font-weight:500;text-transform:lowercase;letter-spacing:.02em;}
  .row-head .val,.p-top .row-head .val,#jumpCell .row-head .val{color:var(--fg);opacity:.6;font-size:12px;}
  input[type=number],input[type=text]{background:transparent;color:var(--fg);border:none;border-bottom:2px solid var(--fg);border-radius:0;}
  #drop{border:2px dashed var(--fg);border-radius:0;}
  #drop .big,.statusline,#status,#fileMeta,.anchorbar .n{color:var(--fg);}
  #fileMeta,#status{opacity:.6;}
  canvas#wave{border:none;border-top:2px solid var(--fg);border-bottom:2px solid var(--fg);}
  #protocolWarning p{color:var(--ac)!important;}

  /* ---- balanced layout: pad on the centre axis, mirrored side columns ---- */
  :root{--bg:#f3ecd9;--fg:#1a1a1a;--ac:#e63b2e;}
  audio{color-scheme:normal;}
  header{align-items:center;}
  .hr{display:flex;align-items:center;gap:14px;}
  #starCv{width:48px;height:48px;}
  .cols{grid-template-columns:minmax(0,1fr) minmax(260px,.9fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:20px 48px;align-items:stretch;}
  #band{grid-column:1/-1;grid-row:1;display:grid;gap:8px;align-self:start;}
  .bandMeta{display:flex;justify-content:space-between;align-items:center;min-height:28px;}
  #fileMeta{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #drop{padding:10px;}
  canvas#wave{width:100%;height:80px;}
  #colL,#colR{display:grid;align-content:space-between;gap:20px;grid-row:2;align-self:stretch;min-height:0;}
  #colL{grid-column:1;} #colR{grid-column:3;}
  #center{display:flex;align-items:center;justify-content:center;grid-column:2;grid-row:2;min-height:0;align-self:stretch;}
  #xySec{flex:1;height:100%;align-self:stretch;margin:0;}
  #btnRandom{grid-column:1;grid-row:3;justify-self:start;align-self:start;width:128px;margin:0;}
  #btnResetParams{grid-column:3;grid-row:3;justify-self:end;align-self:start;width:128px;margin:0;}
  #botC{grid-column:2;grid-row:3;display:block;align-self:start;}
  #controls{display:block!important;margin:0;}
  #params{display:none!important;}
  #colL .row,#colR .row{display:grid;grid-template-columns:92px minmax(0,1fr) 52px;align-items:center;gap:12px;margin:0;}
  #colL .row-head label,#colR .row-head label{order:1;text-align:left;white-space:nowrap;width:auto;}
  #colL .row input[type=range],#colR .row input[type=range]{order:2;width:100%;max-width:none;margin:0;}
  #colL .row-head .val,#colR .row-head .val{order:3;text-align:right;}
  .moderow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:center;}
  #colL .modeBtn,#colR #btnFilter{width:100%;height:36px;font-size:14px;}
  #colL .zoneval{height:36px;}
  #notesBlock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
  @media (max-width:900px){ .cols{grid-template-columns:1fr;grid-template-rows:none;} #band,#colL,#center,#colR,#botC,#btnRandom,#btnResetParams{grid-column:1;grid-row:auto;} #center{height:340px;} }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">

<body>
<div class="wrap">

  <header>
    <span class="logo">microloop</span>
    <button id="btnTheme" class="smallbtn" type="button" style="display:none;">panel</button>
    <div class="hr"><span class="live">live</span><canvas id="starCv" width="560" height="560"></canvas></div>
  </header>

  <section id="protocolWarning" style="display:none;border-color:var(--red);">
    <p style="font-size:12px;color:var(--red);margin:0;line-height:1.7;">Opened via file://. AudioWorklet often fails to load from file:// &mdash; run <code>python3 -m http.server</code> in this folder and open http://localhost:8000/, or upload the page to a web host.</p>
  </section>

  <div class="cols">
    <div id="band">
      <div id="drop">
        <div class="big">DROP AUDIO FILE &middot; OR CLICK</div>
        <input type="file" id="fileInput" accept="audio/*">
      </div>
      <div class="bandMeta"><div id="fileMeta"></div><div id="normalizeRow" style="display:none;"><button class="smallbtn" id="btnNormalize">NORMALIZE</button></div></div>
      <div id="waveWrap">
        <canvas id="wave" width="1400" height="110"></canvas>
        <div class="anchorbar">
          <span class="n" id="anchorCount">ANCHORS 0</span>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="number" id="anchorRandCount" value="5" min="1" max="20" style="width:56px;padding:5px 6px;">
            <button class="smallbtn" id="btnRandomAnchors">RANDOM</button>
            <button class="smallbtn" id="btnClearAnchors">CLEAR</button>
          </div>
        </div>
      </div>
    </div>

    <div id="colL">
      <div class="row">
        <div class="row-head"><label for="loopLen">LOOP LENGTH</label><span class="val" id="valLoopLen">120 ms</span></div>
        <input type="range" id="loopLen" min="10" max="600" value="120">
      </div>
      <div class="moderow">
        <div class="modes">
          <button type="button" class="modeBtn" id="zoneModeMs">MS</button>
          <button type="button" class="modeBtn primary" id="zoneModeBpm">BPM</button>
        </div>
        <div class="zoneval">
          <div class="minmax" id="zoneMsControls"><input type="number" id="zoneMin" value="150" min="10" step="10"><span>&ndash;</span><input type="number" id="zoneMax" value="1500" min="10" step="10"></div>
          <div id="zoneBpmControls" style="display:none;"><input type="number" id="bpmVal" value="120" min="20" max="300" step="1"><span>BPM</span></div>
        </div>
      </div>
      <div id="notesBlock">
        <button type="button" class="noteAlt" data-value="4">1/1</button>
        <button type="button" class="noteAlt" data-value="2">1/2</button>
        <button type="button" class="noteAlt primary" data-value="1">1/4</button>
        <button type="button" class="noteAlt" data-value="0.5">1/8</button>
        <button type="button" class="noteAlt" data-value="0.3333333">1/12</button>
        <button type="button" class="noteAlt" data-value="0.25">1/16</button>
        <button type="button" class="noteAlt" data-value="0.1666667">1/24</button>
        <button type="button" class="noteAlt" data-value="0.125">1/32</button>
      </div>
      <div class="row" id="jumpCell">
        <div class="row-head"><label for="gridJumpProb">GRID JUMP</label><span class="val" id="valGridJump">15%</span></div>
        <input type="range" id="gridJumpProb" min="0" max="100" value="15">
      </div>
    </div>

    <div id="center"><section id="xySec"><canvas id="xyCv" width="340" height="340"></canvas></section></div>

    <div id="colR">
      <div class="row">
        <div class="row-head"><label for="transpose">TRANSPOSE</label><span class="val" id="valTranspose">±0 st</span></div>
        <input type="range" id="transpose" min="-24" max="24" value="0" step="1">
      </div>
      <div class="row">
        <div class="row-head"><label for="density">DENSITY</label><span class="val" id="valDensity">90%</span></div>
        <input type="range" id="density" min="0" max="100" value="90">
      </div>
      <div class="row">
        <div class="row-head"><label for="instability">INSTABILITY</label><span class="val" id="valInstability">100%</span></div>
        <input type="range" id="instability" min="0" max="200" value="100">
      </div>
      <button id="btnFilter" type="button" class="primary">FILTER</button>
    </div>

    <button id="btnRandom">RANDOMIZE</button>
    <div id="botC">
      <section id="controls" style="display:none;">
        <div class="transport">
          <span class="dot" id="liveDot"></span>
          <button class="primary" id="btnPlay">PLAY</button>
          <button id="btnStop" disabled>STOP</button>
          <span style="flex:1"></span>
          <span class="dot" id="recDot"></span>
          <button id="btnRecord" disabled>REC</button>
        </div>
        <div class="statusline" id="status">NO FILE</div>
      </section>
      <section id="recOutput">
        <label class="cap">RECORDED</label>
        <audio id="player" controls></audio>
        <div class="row" style="margin-top:12px;margin-bottom:0;">
          <div class="row-head"><label>FILENAME</label></div>
          <input type="text" id="filenameInput">
        </div>
        <div><a class="dl" id="dlLink">DOWNLOAD</a></div>
      </section>
    </div>
    <button id="btnResetParams">RESET</button>

    <section id="params" style="display:none;"></section>
    <div hidden>
      <input type="number" id="winMin" value="60"><input type="number" id="winMax" value="240">
      <input type="range" id="crush" min="0" max="100" value="30"><span id="valCrush">30%</span>
      <input type="range" id="sober" min="0" max="100" value="15"><span id="valSober">15%</span>
      <input type="range" id="stereo" min="0" max="100" value="30"><span id="valStereo">30%</span>
      <input type="range" id="xfade" min="0" max="150" value="3"><span id="valXfade">3 ms</span>
    </div>
  </div>
</div>

<script>
(function(){
  if(location.protocol==='file:'){
    const w=document.getElementById('protocolWarning');
    if(w) w.style.display='block';
  }

  const dropEl=document.getElementById('drop');
  const fileInput=document.getElementById('fileInput');
  const fileMeta=document.getElementById('fileMeta');
  const normalizeRow=document.getElementById('normalizeRow');
  const btnNormalize=document.getElementById('btnNormalize');
  const waveWrap=document.getElementById('waveWrap');
  const waveCanvas=document.getElementById('wave');
  const anchorCountEl=document.getElementById('anchorCount');
  const btnClearAnchors=document.getElementById('btnClearAnchors');
  const btnRandomAnchors=document.getElementById('btnRandomAnchors');
  const anchorRandCountEl=document.getElementById('anchorRandCount');

  const controls=document.getElementById('controls');
  const paramsSec=document.getElementById('params');
  const btnPlay=document.getElementById('btnPlay');
  const btnStop=document.getElementById('btnStop');
  const btnRecord=document.getElementById('btnRecord');
  const liveDot=document.getElementById('liveDot');
  const recDot=document.getElementById('recDot');
  const statusEl=document.getElementById('status');

  const winMinEl=document.getElementById('winMin');
  const winMaxEl=document.getElementById('winMax');
  const zoneMinEl=document.getElementById('zoneMin');
  const zoneMaxEl=document.getElementById('zoneMax');
  const zoneModeMsEl=document.getElementById('zoneModeMs');
  const zoneModeBpmEl=document.getElementById('zoneModeBpm');
  const zoneMsControls=document.getElementById('zoneMsControls');
  const zoneBpmControls=document.getElementById('zoneBpmControls');
  const bpmValEl=document.getElementById('bpmVal');
  const noteAltEls=Array.from(document.querySelectorAll('.noteAlt'));
  const gridJumpProbEl=document.getElementById('gridJumpProb');
  const valGridJump=document.getElementById('valGridJump');
  function syncZoneModeUI(){
    const bpmMode=zoneModeBpmEl.classList.contains('primary');
    zoneMsControls.style.display=bpmMode?'none':'flex';
    zoneBpmControls.style.display=bpmMode?'flex':'none';
    document.getElementById('notesBlock').style.display=bpmMode?'grid':'none';
    document.getElementById('jumpCell').style.display=bpmMode?'grid':'none';
  }
  [zoneModeMsEl,zoneModeBpmEl].forEach(el=>el.addEventListener('click',()=>{
    zoneModeMsEl.classList.toggle('primary', el===zoneModeMsEl);
    zoneModeBpmEl.classList.toggle('primary', el===zoneModeBpmEl);
    syncZoneModeUI();
    pushParamsToWorklet();
  }));
  bpmValEl.addEventListener('input',()=>{ pushParamsToWorklet(); });
  bpmValEl.addEventListener('wheel', e=>{ if(document.activeElement===bpmValEl) e.preventDefault(); }, {passive:false});
  noteAltEls.forEach(el=>el.addEventListener('click',()=>{
    const on=noteAltEls.filter(x=>x.classList.contains('primary'));
    if(el.classList.contains('primary') && on.length<=1) return;
    el.classList.toggle('primary');
    pushParamsToWorklet();
  }));
  gridJumpProbEl.addEventListener('input',()=>{
    valGridJump.textContent=gridJumpProbEl.value+'%';
    pushParamsToWorklet();
  });
  syncZoneModeUI();
  function enableAbletonStyleNumberInput(el){
    el.addEventListener('wheel', e=>{ if(document.activeElement===el) e.preventDefault(); }, {passive:false});
    el.style.cursor='ns-resize';
    let dragging=false, startY=0, startVal=0, moved=false;
    el.addEventListener('pointerdown', e=>{
      dragging=true; moved=false;
      startY=e.clientY;
      startVal=parseFloat(el.value)||0;
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    });
    el.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const dy=startY-e.clientY;
      if(Math.abs(dy)>3) moved=true;
      if(!moved) return;
      const step=parseFloat(el.step)||1;
      const min=(el.min!==''&&el.min!=null)?parseFloat(el.min):-Infinity;
      const max=(el.max!==''&&el.max!=null)?parseFloat(el.max):Infinity;
      let nv=startVal+Math.round(dy/4)*step;
      nv=Math.max(min,Math.min(max,nv));
      el.value = Number.isInteger(step) ? Math.round(nv) : nv;
      el.dispatchEvent(new Event('input',{bubbles:true}));
    });
    const endDrag=()=>{
      if(!dragging) return;
      dragging=false;
      if(moved) el.blur();
    };
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
    el.addEventListener('pointerleave', e=>{ if(dragging && e.buttons===0) endDrag(); });
    el.addEventListener('click', ()=>{
      if(!moved){
        requestAnimationFrame(()=>{ el.focus(); el.select(); });
      }
    });
  }
  Array.from(document.querySelectorAll('input[type=number]')).forEach(enableAbletonStyleNumberInput);
  const densityEl=document.getElementById('density');
  const instabilityEl=document.getElementById('instability');
  const crushEl=document.getElementById('crush');
  const soberEl=document.getElementById('sober');
  const stereoEl=document.getElementById('stereo');

    }
    this.prevWasLoop = this.seg ? this.seg.type==='loop' : false;
    this.prevLoopSober = this.prevWasLoop ? this.seg.sober : false;
  }

  processSample(out){
    if(!this.seg || this.seg.remaining<=0){
      this.finishSegmentAndMaybeBleed();
      this.startNewSegment();
      const okForBleed = (this.seg.type==='pass' && !this.seg.sober && this.prevWasLoop && !this.prevLoopSober);
      if(!okForBleed) this.pendingBleed=null;
    }
    const seg=this.seg;

    if(seg.type==='pass'){
      const [v0,v1]=this.readInterp(this.readCursor);
      out[0]=v0; out[1]=v1;
      this.readCursor=(this.readCursor+this.globalRate)%this.srcLength;
    } else {
      if(seg.tilePos>=seg.winLen){
        const P=this.pers();
        const lo=Math.max(4,Math.round(seg.baseWinLen*0.12)), hi=Math.round(seg.baseWinLen*3);
        if(P.ramp>0){
          seg.tileN++;
          const cv=Math.max(0.2,Math.min(3,1+seg.rampCurve*seg.tileN*0.4));
          const g=Math.random()<0.2?0:(0.2+1.6*Math.random())*cv;
          seg.winLen=Math.round(seg.winLen*Math.max(0.55,Math.min(1.8,1+seg.rampDir*Math.min(P.ramp,1.5)*0.3*g)));
          if(seg.winLen<=lo){ seg.winLen=lo; seg.rampDir=1; }
          if(seg.winLen>=hi){ seg.winLen=hi; seg.rampDir=-1; }
        }
        if(P.slip>0) seg.anchor=(((seg.anchor+Math.round(seg.winLen*Math.min(P.slip,1.5)*0.35*seg.slipDir))%this.srcLength)+this.srcLength)%this.srcLength;
        if(P.skip>0 && Math.random()<Math.min(0.9,P.skip*0.6)) seg.anchor=this.pickAnchor();
        seg.muteThis=Math.random()<Math.min(0.9,P.hole*0.55);
        seg.reverseThis=Math.random()<Math.min(0.95,P.flip*0.6);
        seg.tilePos=0;
      }
      const contPos = seg.reverseThis ? (seg.winLen-1-seg.tilePos) : seg.tilePos;
      const winLenInt=Math.max(1, Math.round(seg.winLen));
      const i0=Math.floor(contPos);
      const frac=contPos-i0;
      const i0m=((i0 % winLenInt)+winLenInt)%winLenInt;
      const i1m=(i0m+1)%winLenInt;
      const a0=(seg.anchor+i0m)%this.srcLength, a1=(seg.anchor+i1m)%this.srcLength;
      out[0]=this.channels[0][a0]*(1-frac)+this.channels[0][a1]*frac;
      out[1]=this.channels[1][a0]*(1-frac)+this.channels[1][a1]*frac;
      seg.tilePos+=this.globalRate;
      seg.muteG+=((seg.muteThis?0:1)-seg.muteG)*0.02;
      out[0]*=seg.muteG; out[1]*=seg.muteG;

      const jitter=this.params.instability/100;
      if(this.params.filterOn){
        const jitter=1;
        const t=1-(seg.remaining/seg.total);
        const centerAlpha=1-jitter*0.85;
        const swing=0.28*jitter;
        let alpha=centerAlpha-swing*Math.sin(Math.PI*t)+(Math.random()-0.5)*0.12*jitter;
        alpha=Math.max(0.05,Math.min(1,alpha));
        for(let ci=0;ci<2;ci++){
          const st=this.chanState[ci];
          st.filterY = st.filterY + alpha*(out[ci]-st.filterY);
          out[ci]=st.filterY;
        }
      }

      const crushPct = seg.sober ? 0 : this.params.crush;
      if(crushPct>0){
        const amt=crushPct/100;
        const effAmt=amt*0.3;
        const holdFactor=1+Math.round(Math.pow(effAmt,1.2)*47);
        const bits=Math.max(1, Math.round(16-Math.pow(effAmt,0.8)*15));
        const step=2/Math.pow(2,bits);
        for(let ci=0;ci<2;ci++){
          const st=this.chanState[ci];
          if(st.crushCounter % holdFactor===0) st.crushHeld=out[ci];
          st.crushCounter++;
          let v=Math.round(st.crushHeld/step)*step;
          out[ci]=Math.max(-1,Math.min(1,v));
        }
      }

      if(seg.stereoMode){
        const mid=(out[0]+out[1])/2;
        const side=(out[0]-out[1])/2*seg.stereoFactor;
        out[0]=Math.max(-1,Math.min(1, mid+side));
        out[1]=Math.max(-1,Math.min(1, mid-side));
      }
    }

    if(seg.blendRemaining>0 && this.hasHistory){
      const t = seg.blendTotal>0 ? 1-(seg.blendRemaining-1)/seg.blendTotal : 1;
      for(let ci=0;ci<2;ci++){
        const oldV=this.getHistoryBack(ci,1);
        out[ci]=oldV*(1-t)+out[ci]*t;
      }
      seg.blendRemaining--;
    }

    if(this.pendingBleed && this.pendingBleed.idx < this.pendingBleed.length){
      const bi=this.pendingBleed.idx;
      const decay=1-bi/this.pendingBleed.length;
      const mixGain=(this.params.bleed/100)*0.85;
      out[0]=Math.max(-1,Math.min(1, out[0]+this.pendingBleed.arrays[0][bi]*decay*mixGain));
      out[1]=Math.max(-1,Math.min(1, out[1]+this.pendingBleed.arrays[1][bi]*decay*mixGain));
      this.pendingBleed.idx++;
    }


    this.pushHistory(0,out[0]);
    this.pushHistory(1,out[1]);
    this.historyPos++;
    this.hasHistory=true;
    seg.remaining--;
  }

  process(inputs, outputs){
    const output=outputs[0];
    const blockSize=output[0] ? output[0].length : 128;
    if(!this.loaded || this.srcLength<8){
      for(let ci=0;ci<output.length;ci++) output[ci].fill(0);
      return true;
    }
    const tmp=[0,0];
    for(let i=0;i<blockSize;i++){
      this.processSample(tmp);
      for(let ci=0;ci<output.length;ci++){
        output[ci][i]=tmp[ci % 2];
      }
    }
    return true;
  }
}

  async function ensureWorklet(){
    if(workletReady) return;
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const blob=new Blob([PROCESSOR_SRC], {type:'text/javascript'});
    const url=URL.createObjectURL(blob);
    try{
      await audioCtx.audioWorklet.addModule(url);
    }catch(err){
      throw new Error('Failed to load the AudioWorklet module ('+err.message+'). This browser or origin may block blob-based worklets.');
    }
    workletNode = new AudioWorkletNode(audioCtx, 'malfunction-processor', {
      numberOfInputs:0, numberOfOutputs:1, outputChannelCount:[2]
    });
      workletNode.port.onmessage=onSeg;
    workletReady=true;
  }

  function handleFile(file){
    if(!file) return;
    statusEl.textContent='DECODING...';
    const reader=new FileReader();
    reader.onload=async function(e){
      let buf;
      try{
        buf=await decodeAudioDataSafely(e.target.result.slice(0));
      }catch(err){
        statusEl.textContent='Failed to decode audio ('+file.type+'): '+err.message;
        return;
      }

      audioBuffer=buf;
      anchors=[];
      const kb=(file.size/1024).toFixed(1);
      fileMeta.style.display='block';
      fileMeta.textContent=`${file.name}  —  ${kb} KB  —  ${buf.duration.toFixed(2)} s / ${buf.sampleRate}Hz / ${buf.numberOfChannels}ch`;
      normalizeRow.style.display='block';
      const baseName=file.name.replace(/\.[^.]+$/,'');
      originalFileName=baseName+'_microloop-live';
      filenameInput.value=originalFileName+'.wav';
      waveWrap.style.display='block';
      controls.style.display='block';
      paramsSec.style.display='grid';
      updateAnchorLabel();
      drawWave();

      try{
        audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
        if(!window.AudioWorkletNode || !audioCtx.audioWorklet){
          throw new Error('This browser does not support AudioWorklet. Use a recent Chrome, Edge, Firefox or Safari.');
        }
        await ensureWorklet();
        const ch0=buf.getChannelData(0);
        const ch1=buf.numberOfChannels>1 ? buf.getChannelData(1) : ch0;
        workletNode.port.postMessage({type:'load', channels:[ch0, ch1]});
        pushParamsToWorklet();
        pushAnchorsToWorklet();
        btnPlay.disabled=false;
        statusEl.textContent='READY';
      }catch(err){
        statusEl.textContent='AudioWorklet setup failed: '+err.message;
      }
    };
    reader.readAsArrayBuffer(file);
  }

  dropEl.addEventListener('click',()=>fileInput.click());
  dropEl.addEventListener('dragover',(e)=>{e.preventDefault();dropEl.classList.add('hover');});
  dropEl.addEventListener('dragleave',()=>dropEl.classList.remove('hover'));
  dropEl.addEventListener('drop',(e)=>{
    e.preventDefault();dropEl.classList.remove('hover');
    if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change',(e)=>{
    if(e.target.files.length) handleFile(e.target.files[0]);
  });

  // ---------------- 再生/停止 ----------------
  btnPlay.addEventListener('click',async ()=>{
    await ensureWorklet();
    await audioCtx.resume();
    workletNode.connect(audioCtx.destination);
      analyser=audioCtx.createAnalyser(); analyser.fftSize=256; analyser.smoothingTimeConstant=0.75;
      workletNode.connect(analyser);
    isPlaying=true;
    liveDot.classList.add('live');
    btnPlay.disabled=true;
    btnStop.disabled=false;
    btnRecord.disabled=false;
    statusEl.textContent='PLAYING';
  });
  btnStop.addEventListener('click',()=>{
    if(workletNode) workletNode.disconnect();
    isPlaying=false;
    liveDot.classList.remove('live');
    btnPlay.disabled=false;
    btnStop.disabled=true;
    btnRecord.disabled=true;
    if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
    statusEl.textContent='STOPPED';
  });

  // ---------------- 録音 ----------------
  function bufferToWav(buffer){
    const numCh=buffer.numberOfChannels;
    const sr=buffer.sampleRate;
    const len=buffer.length;
    const bytesPerSample=2;
    const blockAlign=numCh*bytesPerSample;
    const dataSize=len*blockAlign;
    const bufArr=new ArrayBuffer(44+dataSize);
    const view=new DataView(bufArr);
    function writeStr(off,str){for(let i=0;i<str.length;i++) view.setUint8(off+i,str.charCodeAt(i));}
    writeStr(0,'RIFF');
    view.setUint32(4,36+dataSize,true);
    writeStr(8,'WAVE');
    writeStr(12,'fmt ');
    view.setUint32(16,16,true);
    view.setUint16(20,1,true);
    view.setUint16(22,numCh,true);
    view.setUint32(24,sr,true);
    view.setUint32(28,sr*blockAlign,true);
    view.setUint16(32,blockAlign,true);
    view.setUint16(34,16,true);
    writeStr(36,'data');
    view.setUint32(40,dataSize,true);
    const channels=[];
    for(let c=0;c<numCh;c++) channels.push(buffer.getChannelData(c));
    let offset=44;
    for(let i=0;i<len;i++){
      for(let c=0;c<numCh;c++){
        let s=Math.max(-1,Math.min(1,channels[c][i]));
        s=s<0?s*0x8000:s*0x7FFF;
        view.setInt16(offset,s,true);
        offset+=2;
      }
    }
    return new Blob([bufArr],{type:'audio/wav'});
  }

  function sanitizeFilename(name){
    let n=(name||'microloop-live').trim();
    if(!n) n='microloop-live';
    if(!/\.\w+$/.test(n)) n+='.wav';
    return n;
  }
  filenameInput.addEventListener('input',()=>{
    if(dlLink.href) dlLink.download=sanitizeFilename(filenameInput.value);
  });

  let lastRecUrl=null;
  btnRecord.addEventListener('click',()=>{
    if(!isPlaying) return;
    if(!mediaRecorder || mediaRecorder.state==='inactive'){
      const thisRecDest = audioCtx.createMediaStreamDestination();
      recDest = thisRecDest;
      workletNode.connect(thisRecDest);
      const thisChunks=[];
      recChunks=thisChunks;
      mediaRecorder=new MediaRecorder(thisRecDest.stream);
      mediaRecorder.ondataavailable=(e)=>{ if(e.data.size>0) thisChunks.push(e.data); };
      mediaRecorder.onstop=async ()=>{
        statusEl.textContent='CONVERTING TO WAV...';
        const webmBlob=new Blob(thisChunks, {type:'audio/webm'});
        try{
          const arrBuf=await webmBlob.arrayBuffer();
          const decoded=await decodeAudioDataSafely(arrBuf);
          const wavBlob=bufferToWav(decoded);
          const url=URL.createObjectURL(wavBlob);
          if(lastRecUrl) URL.revokeObjectURL(lastRecUrl);
          lastRecUrl=url;
          player.src=url;
          dlLink.href=url;
          dlLink.download=sanitizeFilename(filenameInput.value);
          recOutput.style.display='block';
          statusEl.textContent='REC DONE - WAV READY';
        }catch(err){
          // 変換に失敗した場合はwebmのまま渡す(何もないよりはまし)
          const url=URL.createObjectURL(webmBlob);
          if(lastRecUrl) URL.revokeObjectURL(lastRecUrl);
          lastRecUrl=url;
          player.src=url;
          dlLink.href=url;
          dlLink.download=sanitizeFilename(filenameInput.value).replace(/\.wav$/i,'.webm');
          recOutput.style.display='block';
          statusEl.textContent='WAV conversion failed, falling back to webm: '+err.message;
        }
        recDot.classList.remove('rec');
        btnRecord.textContent='REC';
        try{ workletNode.disconnect(thisRecDest); }catch(e){}
      };
      mediaRecorder.start();
      recDot.classList.add('rec');
      btnRecord.textContent='STOP REC';
      statusEl.textContent='RECORDING...';
    } else {
      mediaRecorder.stop();
    }
  });
})();
