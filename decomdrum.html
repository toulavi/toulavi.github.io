<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DECOMPOSE DRUM — demo</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}
  .wrap{max-width:1000px;margin:30px auto;padding:0 20px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:#999;margin-bottom:22px}
  .panel{background:#1b1b1b;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:14px}
  input[type=file]{width:100%}
  canvas{width:100%;height:180px;background:#080808;border-radius:8px;display:block;margin-top:12px}
  .pads{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  button{border:1px solid #444;background:#252525;color:#eee;border-radius:9px;padding:18px 8px;font-size:15px;cursor:pointer}
  button:hover{background:#303030}
  button.active{background:#555}
  .name{font-weight:700}.pos{font-size:11px;color:#888;margin-top:5px}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  label{display:block;color:#aaa;font-size:13px}
  input[type=range]{width:100%}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .transport button{padding:10px 16px}
  .status{font-family:monospace;color:#aaa;min-height:22px;margin-top:10px}
  .hint{font-size:12px;color:#777;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>DECOMPOSE DRUM</h1>
  <div class="sub">ひとつの音源を、4種類の「音の性質」に解体して叩く簡易デモ</div>

  <div class="panel">
    <input id="file" type="file" accept="audio/*">
    <canvas id="wave" width="1200" height="220"></canvas>
    <div class="hint">音源を読み込むと、波形を「低域 / アタック / 高域 / 長い音」に分解します。パッドを叩くと、その性質を持つ場所から短い断片を取り出します。</div>
  </div>

  <div class="panel">
    <div class="pads">
      <button data-kind="low"><div class="name">KICK</div><div class="pos">低い成分</div></button>
      <button data-kind="attack"><div class="name">SNARE</div><div class="pos">強いアタック</div></button>
      <button data-kind="high"><div class="name">HAT</div><div class="pos">高い成分</div></button>
      <button data-kind="long"><div class="name">TOM / FX</div><div class="pos">長く鳴る場所</div></button>
    </div>
    <div class="status" id="status">音源を読み込んでください。</div>
  </div>

  <div class="panel controls">
    <div>
      <label>解体率 <span id="decompVal">55%</span></label>
      <input id="decomp" type="range" min="0" max="100" value="55">
    </div>
    <div>
      <label>断片の長さ <span id="lenVal">180ms</span></label>
      <input id="len" type="range" min="50" max="500" value="180">
    </div>
  </div>

  <div class="panel transport">
    <div class="row">
      <button id="start">▶ 再生</button>
      <button id="stop">■ 停止</button>
      <button id="random">✦ 再配置</button>
    </div>
    <div class="hint" style="margin-top:10px">
      「再配置」を押すと、同じ音源から各パッドが参照する場所を変えます。<br>
      まずは声・ピアノ・環境音など、ドラムではない音源を入れると挙動がわかりやすいです。
    </div>
  </div>
</div>

<script>
let ctx, buffer=null, master=null;
const wave=document.getElementById('wave'), g=wave.getContext('2d');
const file=document.getElementById('file');
const status=document.getElementById('status');
const decomp=document.getElementById('decomp');
const len=document.getElementById('len');
let map={low:0,attack:0,high:0,long:0};

function ensureCtx(){
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=.85; master.connect(ctx.destination);
  }
  if(ctx.state==='suspended') ctx.resume();
}

file.onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  ensureCtx();
  buffer=await ctx.decodeAudioData(await f.arrayBuffer());
  drawWave(); redistribute();
  status.textContent=`${f.name} / ${buffer.duration.toFixed(2)} sec — 解体完了`;
};

function drawWave(){
  g.clearRect(0,0,wave.width,wave.height);
  if(!buffer)return;
  const data=buffer.getChannelData(0);
  g.strokeStyle='#888'; g.beginPath();
  const step=Math.ceil(data.length/wave.width);
  for(let x=0;x<wave.width;x++){
    let max=0;
    for(let j=0;j<step && x*step+j<data.length;j++) max=Math.max(max,Math.abs(data[x*step+j]));
    const y=wave.height/2-max*95;
    g.moveTo(x,y); g.lineTo(x,wave.height/2+max*95);
  }
  g.stroke();
  drawMarkers();
}
function drawMarkers(){
  if(!buffer)return;
  const kinds=Object.keys(map);
  kinds.forEach((k,i)=>{
    const x=map[k]/buffer.duration*wave.width;
    g.fillStyle='#eee'; g.fillRect(x-2,0,4,wave.height);
    g.font='12px system-ui'; g.fillText(k.toUpperCase(),Math.min(x+5,wave.width-70),18+i*15);
  });
}

function featureAt(t){
  const data=buffer.getChannelData(0), sr=buffer.sampleRate;
  const center=Math.floor(t*sr), n=Math.floor(sr*.08);
  let sum=0, low=0, high=0, prev=0, attack=0;
  for(let i=-n;i<n;i+=4){
    const idx=Math.max(1,Math.min(data.length-1,center+i));
    const v=data[idx], a=Math.abs(v);
    sum+=a; attack=Math.max(attack,Math.abs(v-data[idx-1]));
    // crude low/high energy estimates
    const v2=data[Math.max(0,idx-8)];
    low+=Math.abs(v+v2)*.5;
    high+=Math.abs(v-v2);
    prev=v;
  }
  return {amp:sum,low,high,attack};
}
function redistribute(){
  if(!buffer)return;
  const N=700, dur=buffer.duration, scores={low:[],attack:[],high:[],long:[]};
  for(let i=0;i<N;i++){
    const t=(i+.5)/N*dur;
    const f=featureAt(t);
    scores.low.push([f.low,t]); scores.attack.push([f.attack,t]);
    scores.high.push([f.high,t]); scores.long.push([f.amp,t]);
  }
  const rate=Number(decomp.value)/100;
  for(const k of Object.keys(scores)){
    scores[k].sort((a,b)=>b[0]-a[0]);
    // lower decomposition = less specialized, more central/random
    const top=Math.max(1,Math.floor((1-rate)*scores[k].length*.8 + 8));
    map[k]=scores[k][Math.floor(Math.random()*top)][1];
  }
  drawWave();
}
function playSlice(kind){
  if(!buffer)return;
  ensureCtx();
  const t=map[kind];
  const dur=Math.min(Number(len.value)/1000,buffer.duration-t);
  const src=ctx.createBufferSource();
  const gain=ctx.createGain();
  src.buffer=buffer;
  const now=ctx.currentTime;
  gain.gain.setValueAtTime(0,now);
  gain.gain.linearRampToValueAtTime(.9,now+.008);
  gain.gain.setValueAtTime(.9,now+Math.max(.012,dur-.025));
  gain.gain.linearRampToValueAtTime(0,now+dur);
  src.connect(gain).connect(master);
  src.start(now,t,dur);
  status.textContent=`${kind.toUpperCase()} ← ${t.toFixed(2)}s / ${Math.round(dur*1000)}ms`;
}
document.querySelectorAll('.pads button').forEach(b=>{
  b.onclick=()=>{ b.classList.add('active'); setTimeout(()=>b.classList.remove('active'),80); playSlice(b.dataset.kind); };
});
decomp.oninput=()=>{document.getElementById('decompVal').textContent=decomp.value+'%'; redistribute()};
len.oninput=()=>document.getElementById('lenVal').textContent=len.value+'ms';
document.getElementById('random').onclick=redistribute;
document.getElementById('start').onclick=()=>{
  if(!buffer)return; ensureCtx();
  const src=ctx.createBufferSource(); src.buffer=buffer; src.connect(master); src.start();
  status.textContent='元音源を再生中';
};
document.getElementById('stop').onclick=()=>{ if(ctx)ctx.suspend(); status.textContent='停止'; };
</script>
</body>
</html>
